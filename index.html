
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nano Banana Pro Studio</title>
    <script>
      // CRITICAL: Initialize process.env immediately before any other scripts
      window.process = window.process || { env: {} };
      console.log("System Initialized: process.env ready");
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              banana: {
                50: '#fefce8',
                100: '#fef9c3',
                200: '#fef08a',
                300: '#fde047',
                400: '#facc15',
                500: '#eab308',
                600: '#ca8a04',
                700: '#a16207',
                800: '#854d0e',
                900: '#713f12',
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          }
        }
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "lucide-react": "https://esm.sh/lucide-react@0.300.0",
    "@google/genai": "https://esm.sh/@google/genai@0.1.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
  <body class="bg-slate-950 text-slate-200 antialiased min-h-screen flex flex-col">
    <div id="root" class="flex-1 flex flex-col"></div>
    <script>
      // Global error handler to catch initialization failures
      window.addEventListener('error', function(e) {
        console.error("Global Error Caught:", e.error);
        const root = document.getElementById('root');
        if (root && root.childElementCount === 0) {
           root.innerHTML = `
             <div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#f87171; text-align:center; padding:20px;">
               <h1 style="font-size:20px; font-weight:bold; margin-bottom:10px;">System Error</h1>
               <p>Failed to load application resources.</p>
               <pre style="background:#111; padding:15px; border-radius:8px; margin-top:20px; text-align:left; font-size:11px; max-width:90%; overflow:auto; border:1px solid #333;">${e.message || 'Unknown error'}</pre>
             </div>
           `;
        }
      });
    </script>
  </body>
</html>
